<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>3D Planetarium ❙ S.O</title>
    <link
      title="Manjiro5, CC0, via Wikimedia Commons"
      rel="icon"
      href="https://upload.wikimedia.org/wikipedia/commons/8/80/Icon_planet.svg"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="config.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="loading-screen">
        <div id="loading-text">Chargement du système solaire</div>
        <div id="loading-bar">
          <div id="loading-progress"></div>
        </div>
      </div>
      <canvas id="scene3d" tabindex="0"></canvas>

      <div id="main-ui">
        <div id="menu-button">☉</div>

        <div id="dropdown-menu" class="hidden">
          <ul id="body-list"></ul>
        </div>

        <div id="time-menu" class="hidden">
          <button id="time-backward">◀</button>
          <button id="time-pause">⏸</button>
          <button id="time-forward">▶</button>
          <span id="time-factor">x1</span>
        </div>
      </div>

      <div id="mobile-warning" class="mobile-warning hidden">
        <div class="mobile-warning-content">
          <h1>Mobile not supported</h1>
          <p>
            Planetarium is not optimized for mobile devices yet. Please open on
            a desktop or laptop for the full experience.
          </p>
          <button id="mobile-warning-dismiss">Continue</button>
        </div>
      </div>
    </div>
  </body>
</html>
